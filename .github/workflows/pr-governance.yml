name: PR Governance & Architectural Guardrails

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Least privilege by default (OpenSSF Scorecard, Token-Permissions). The semantic-title check
# reads pull request metadata, so that scope is granted explicitly rather than inherited.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-metadata:
    name: Verify PR Title & Issue Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Conventional Commit Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false

      - name: Validate Issue Linkage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prTitle = context.payload.pull_request.title || '';
            const isMaintenance = /^(docs|chore|ci|fix|hotfix|refactor|test)(\(.*\))?:/i.test(prTitle);
            const hasIssueLink = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+/i.test(prBody);

            if (!hasIssueLink && !isMaintenance) {
              core.setFailed(
                'PR description must reference a tracking issue via "Closes #<issue-number>" as mandated in docs/AGENT_INSTRUCTIONS.md.'
              );
            }

  boundary-guardrails:
    name: Verify Architectural Boundary Separation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert No Simulation Imports in Agent Engine
        run: |
          if [ -d "src/lib/recovery" ] || [ -d "src/lib/ai" ]; then
            VIOLATIONS=$(grep -rnE "(from\s+['\"].*simulation.*['\"]|require\(['\"].*simulation.*['\"]\))" src/lib/recovery/ src/lib/ai/ 2>/dev/null || true)
            if [ -n "$VIOLATIONS" ]; then
              echo "::error::Architectural Boundary Violation! Core agent modules cannot import from the simulation response model."
              echo "$VIOLATIONS"
              exit 1
            fi
          fi
          echo "Architectural boundary check passed."
