name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Compilation Check
        run: npm run typecheck

      - name: Linting Check
        run: npm run lint

      - name: Unit Tests (Stopping Rules, Contact Hours, Classifier, Idempotency)
        run: npm test

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      DATABASE_URL: file:./data/recoverai.db
      GEMINI_API_KEY: mock_key_for_ci_build
      RAZORPAY_KEY_ID: rzp_test_mock
      RAZORPAY_KEY_SECRET: mock_secret_for_ci_build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build
