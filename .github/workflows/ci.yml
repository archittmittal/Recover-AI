name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default (OpenSSF Scorecard, Token-Permissions). With no top-level block the
# job token inherits the repository default, which may be read/write on every scope — far more
# than any step here needs.
permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Compilation Check
        run: npm run typecheck

      - name: Linting Check
        run: npm run lint

      - name: Unit Tests (Stopping Rules, Contact Hours, Classifier, Idempotency)
        run: npm test

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      DATABASE_URL: file:./data/recoverai.db
      GEMINI_API_KEY: mock_key_for_ci_build
      RAZORPAY_KEY_ID: rzp_test_mock
      RAZORPAY_KEY_SECRET: mock_secret_for_ci_build
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Restore Next.js Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build
