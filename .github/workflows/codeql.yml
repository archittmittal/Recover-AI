name: "CodeQL Advanced Security Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 05:30 UTC (11:00 AM IST)
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required for all workflows
      security-events: write
      # Required to fetch code and actions
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Code Scanning availability
        id: code-scanning
        run: |
          status_code=$(curl -sS -o /tmp/code-scanning-response.json -w "%{http_code}" \
            -H "authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")

          if [[ "$status_code" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status_code" == "403" || "$status_code" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            message=$(jq -r '.message // "Code scanning is not enabled for this repository."' /tmp/code-scanning-response.json)
            echo "::notice::Skipping CodeQL analysis: ${message}"
          else
            echo "Unexpected API response ($status_code) while checking code scanning availability." >&2
            cat /tmp/code-scanning-response.json >&2
            exit 1
          fi

      - name: Initialize CodeQL Analysis Engine
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
